<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neko Nine">
<meta name="format-detection" content="telephone=no">
<title>Neko Nine</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100dvh}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;image-rendering:pixelated}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ---- HUD (unchanged look from v188) ---- */
#msg{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(60px,calc(env(safe-area-inset-right) + 60px));
  padding:6px 10px;border-radius:999px;background:#0008;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;z-index:20}
#lifeHud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:20;
  padding:5px 7px;border-radius:10px;background:rgba(0,0,0,.42);pointer-events:none;backdrop-filter:blur(4px)}
#lifeCats{display:flex;align-items:center;gap:1px;height:12px;white-space:nowrap}
.lifeCat{width:14px;height:10px;object-fit:contain;image-rendering:pixelated;filter:brightness(0) invert(1);opacity:.96;display:block}
.lifeCat.lost{animation:lifeLost .6s ease-in forwards}
@keyframes lifeLost{0%{opacity:1;transform:translateY(0) scale(1.4)}100%{opacity:0;transform:translateY(-10px) scale(.4)}}
#lifeHud.last .lifeCat{animation:heart 1s ease-in-out infinite}
@keyframes heart{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}}

/* ---- controls ---- */
.controls{position:fixed;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
  bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:30;pointer-events:none}
.controls button{pointer-events:auto}
.pad{display:flex;gap:10px}
.controls button{width:76px;height:76px;border:1px solid #ffffff44;border-radius:22px;background:#ffffff22;color:#fff;font-size:28px;user-select:none}
.controls button.active{background:#ffffff44;transform:scale(.97)}
#jump{width:100px;height:100px;border-radius:50%;font-size:17px;font-weight:700}
@media (orientation:landscape) and (max-height:600px){
  .controls{left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom))}
  #left,#right{width:74px;height:74px}
  #jump{width:86px;height:86px}
  #lifeHud{top:max(6px,env(safe-area-inset-top));padding:4px 6px}
  .lifeCat{width:13px;height:9px}
  #msg{top:max(6px,env(safe-area-inset-top));right:max(54px,calc(env(safe-area-inset-right) + 54px))}
}
body.nohud #lifeHud,body.nohud #msg,body.nohud .controls{opacity:0;pointer-events:none}
body.nohud .controls button{pointer-events:none}
#lifeHud,#msg,.controls{transition:opacity .5s ease}

/* ---- fullscreen button ---- */
#fullscreenBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:46px;height:46px;
  border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.42);color:#fff;font-size:21px;line-height:1;z-index:60;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
@media (orientation:landscape) and (max-height:600px){#fullscreenBtn{width:40px;height:40px;top:max(6px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));border-radius:12px;font-size:18px}}

/* ---- title ---- */
#titleScreen{position:fixed;inset:0;z-index:50;background:#050505;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .65s ease,visibility .65s ease}
#titleScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
.titleInner{display:flex;align-items:center;justify-content:center;gap:clamp(28px,6vw,86px);width:min(88vw,980px);transform:translateY(-1vh)}
.titleCat{width:clamp(88px,15vw,170px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 18px rgba(255,255,255,.07));animation:titleCatFloat 3.4s ease-in-out infinite}
.titleText{text-align:left;color:#fff}
.titleName{font:800 clamp(48px,10vw,112px)/.9 system-ui,-apple-system,sans-serif;letter-spacing:.025em;white-space:nowrap;text-shadow:0 0 24px rgba(255,255,255,.08)}
.titleStart{margin-top:clamp(24px,5vh,46px);font:600 clamp(14px,2.2vw,22px)/1 system-ui,-apple-system,sans-serif;letter-spacing:.22em;opacity:.72;animation:titlePulse 1.8s ease-in-out infinite}
.titleMenu{margin-top:clamp(18px,4vh,36px);display:none;gap:14px;flex-wrap:wrap}
#titleScreen.hasSave .titleStart{display:none}
#titleScreen.hasSave .titleMenu{display:flex}
.titleMenu button{min-width:150px;height:48px;padding:0 22px;border:2px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font:800 15px/1 system-ui,-apple-system,sans-serif;letter-spacing:.12em}
.titleMenu button.primary{background:rgba(255,255,255,.9);color:#111}
.titleClear{margin-top:12px;font:600 12px/1 system-ui;letter-spacing:.2em;opacity:.55;display:none}
#titleScreen.cleared .titleClear{display:block}
@keyframes titlePulse{0%,100%{opacity:.38}50%{opacity:.92}}
@keyframes titleCatFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (orientation:portrait){#titleScreen:before{content:'端末を横向きにしてタップ';position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;opacity:.55;font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.08em}.titleInner{gap:18px}.titleName{font-size:clamp(40px,12vw,72px)}}

/* ---- story / stage card ---- */
#story{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;padding:8vh 8vw;box-sizing:border-box;text-align:center}
#story.show{opacity:1;visibility:visible}
#story .line{font:600 clamp(17px,3vw,26px)/2 system-ui,-apple-system,sans-serif;letter-spacing:.06em;opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s ease,filter 1.1s ease;filter:blur(3px)}
#story .line.on{opacity:1;transform:none;filter:none}
#story .card{display:flex;flex-direction:column;align-items:center;gap:10px}
#story .card .no{font:800 clamp(14px,2vw,18px)/1 system-ui;letter-spacing:.35em;opacity:.6}
#story .card .nm{font:800 clamp(28px,6vw,52px)/1.1 system-ui;letter-spacing:.12em}
#story .card .rule{width:min(50vw,300px);height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.6}
#story .skip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));right:max(22px,env(safe-area-inset-right));font:600 11px system-ui;letter-spacing:.2em;opacity:.35}

/* ---- game over (v148 presentation kept) ---- */
#gameOverScreen{position:fixed;inset:0;z-index:70;display:flex;visibility:hidden;opacity:0;align-items:center;justify-content:center;background:rgba(0,0,0,0);color:#fff;
  transition:opacity .42s ease,background-color .42s ease,visibility 0s linear .42s}
#gameOverScreen.show{visibility:visible;opacity:1;background:#000;transition:opacity .42s ease,background-color .42s ease}
.gameOverPanel{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:min(78vw,520px);transform:translateY(18px) scale(.9);opacity:0}
#gameOverScreen.show .gameOverPanel{animation:gameOverPanelIn .58s cubic-bezier(.18,.82,.24,1.08) .08s both}
.gameOverLives{display:flex;justify-content:center;gap:clamp(4px,.9vw,9px);margin:0 0 18px;min-height:44px}
.gameOverLives img{display:block;width:clamp(30px,5vw,46px);height:clamp(24px,4vw,36px);object-fit:contain;image-rendering:pixelated;opacity:.96;filter:brightness(0) invert(1)}
.gameOverLives img.vanish{animation:lifeVanish .42s ease-in forwards}
@keyframes lifeVanish{0%{opacity:.92;transform:scale(1)}65%{opacity:.28;transform:scale(.72)}100%{opacity:0;transform:scale(.15)}}
.gameOverTitle{font:900 clamp(38px,8vw,78px)/.95 system-ui,-apple-system,sans-serif;letter-spacing:.11em;text-shadow:0 4px 18px rgba(0,0,0,.55);white-space:nowrap}
.gameOverLine{width:min(66vw,360px);height:2px;margin:0 0 18px;background:rgba(255,255,255,.88);transform:scaleX(0)}
#gameOverScreen.show .gameOverLine{animation:gameOverLineIn .46s ease-out .24s both}
.gameOverQuote{margin-top:16px;color:rgba(255,255,255,.84);font:700 clamp(15px,2.4vw,21px)/1.4 system-ui,-apple-system,sans-serif;letter-spacing:.06em;min-height:1.4em}
#gameOverScreen.lifeCount .gameOverTitle,#gameOverScreen.lifeCount .gameOverQuote,#gameOverScreen.lifeCount .goButtons,#gameOverScreen.lifeCount .gameOverLine{opacity:0!important;animation:none!important}
.goButtons{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px;opacity:0}
#gameOverScreen.show .goButtons{animation:retryIn .34s ease-out .46s both}
#retryBtn{min-width:150px;height:52px;padding:0 30px;border:2px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font:800 17px/1 system-ui,-apple-system,sans-serif;letter-spacing:.14em}
#retryBtn:active{transform:scale(.96);background:rgba(255,255,255,.24)}
.retryNote{font:600 12px/1 system-ui;letter-spacing:.12em;opacity:.55}
@keyframes gameOverPanelIn{0%{opacity:0;transform:translateY(18px) scale(.9)}65%{opacity:1;transform:translateY(-2px) scale(1.025)}100%{opacity:1;transform:none}}
@keyframes gameOverLineIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes retryIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#retryMessage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 8vw;box-sizing:border-box;
  color:#fff;text-align:center;opacity:0;pointer-events:none;font:600 clamp(19px,3.25vw,29px)/1.9 system-ui,-apple-system,sans-serif;letter-spacing:.045em}
#retryMessage.show{animation:retryMessageFade 1s ease .35s both}
#retryMessage .first{position:relative;opacity:0;transform:translateY(10px);text-shadow:0 0 18px rgba(255,255,255,.12)}
#retryMessage.show .first{animation:retryWords 1.25s cubic-bezier(.2,.7,.2,1) .75s both}
#gameOverScreen.retryMoment .gameOverPanel{opacity:0!important;transition:opacity .7s ease}
@keyframes retryMessageFade{from{opacity:0}to{opacity:1}}
@keyframes retryWords{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@media (orientation:landscape) and (max-height:600px){.gameOverTitle{font-size:clamp(34px,9vh,58px)}.gameOverLine{margin-bottom:12px}#retryBtn{height:46px;min-width:138px}.goButtons{margin-top:18px}}

/* ---- ending ---- */
#endingText{position:fixed;left:0;right:0;bottom:max(9vh,calc(env(safe-area-inset-bottom) + 24px));z-index:45;text-align:center;pointer-events:none;
  font:600 clamp(17px,2.9vw,26px)/1.8 system-ui,-apple-system,sans-serif;letter-spacing:.06em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8);
  opacity:0;transition:opacity .8s ease;padding:0 8vw}
#endingText.on{opacity:1}
#endingText.you{color:#ffd9a8}
#credits{position:fixed;inset:0;z-index:46;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  opacity:0;visibility:hidden;transition:opacity 2s ease,visibility 2s;text-align:center}
#credits.show{opacity:1;visibility:visible}
#credits .lives{display:flex;gap:6px;margin-bottom:14px}
#credits .lives img{width:34px;height:26px;image-rendering:pixelated;filter:brightness(0) invert(1)}
#credits .lives img.used{opacity:.18}
#credits .t1{font:800 clamp(40px,8vw,84px)/1 system-ui;letter-spacing:.03em}
#credits .t2{font:700 clamp(12px,1.8vw,16px)/1 system-ui;letter-spacing:.4em;opacity:.7;margin-top:6px}
#credits .stats{margin-top:22px;font:600 clamp(12px,1.8vw,15px)/2 system-ui;letter-spacing:.12em;opacity:.8}
#credits .back{margin-top:24px;font:600 12px system-ui;letter-spacing:.25em;opacity:.45;animation:titlePulse 1.8s ease-in-out infinite}
</style>
</head>
<body class="nohud">

<canvas id="game"></canvas>

<div id="lifeHud" aria-label="残機 9"><div id="lifeCats"></div></div>
<div id="msg">STAGE 1</div>
<div class="controls">
  <div class="pad">
    <button id="left" aria-label="左">◀</button>
    <button id="right" aria-label="右">▶</button>
  </div>
  <button id="jump">JUMP</button>
</div>
<button id="fullscreenBtn" type="button" aria-label="フルスクリーン">⛶</button>

<div id="story" aria-live="polite"></div>
<div id="endingText"></div>
<div id="credits">
  <div class="lives"></div>
  <div class="t1">Neko Nine</div>
  <div class="t2">THANK YOU FOR PLAYING</div>
  <div class="stats"></div>
  <div class="back">TAP TO TITLE</div>
</div>

<div id="gameOverScreen" aria-hidden="true">
  <div class="gameOverPanel">
    <div class="gameOverLine"></div>
    <div class="gameOverLives" aria-hidden="true">
      <img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt="">
    </div>
    <div class="gameOverTitle">GAME OVER</div>
    <div class="gameOverQuote" data-text="九つあっても、足りなかった……。"></div>
    <div class="goButtons">
      <button id="retryBtn" type="button">RETRY</button>
      <div class="retryNote"></div>
    </div>
  </div>
  <div id="retryMessage" aria-hidden="true"><div class="first"></div></div>
</div>

<div id="titleScreen" aria-label="Neko Nine タイトル画面">
  <div class="titleInner">
    <img id="titleCat" class="titleCat" alt="" draggable="false">
    <div class="titleText">
      <div class="titleName">Neko Nine</div>
      <div class="titleStart">TAP TO START</div>
      <div class="titleMenu">
        <button id="btnContinue" class="primary" type="button">つづきから</button>
        <button id="btnNew" type="button">はじめから</button>
      </div>
      <div class="titleClear">♡ ALL CLEAR</div>
    </div>
  </div>
</div>

<script src="js/assets.js"></script>
<script src="js/engine.js"></script>
<script src="js/stages.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}),{once:true});
}
</script>
</body>
</html>
